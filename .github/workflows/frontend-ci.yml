name: Frontend CI

on:
  push:
    paths:
      - 'client/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  lint-and-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          cd client
          npm ci

      - name: Lint with ESLint
        run: |
          cd client
          npm run lint || echo "::warning::ESLint completed with warnings"
        continue-on-error: true

      - name: Type check with TypeScript
        run: |
          cd client
          npm run typecheck || echo "::warning::TypeScript check completed with warnings"
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          cd client
          npm run test:coverage || echo "::warning::Tests completed with failures"
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: client/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false

      - name: Build application
        env:
          VITE_API_BASE_URL: http://localhost:23056
          VITE_API_VERSION: /api/v1
          VITE_BASE_PATH: /
          VITE_NODE_ENV: production
          VITE_ENABLE_LOGGING: 'false'
        run: |
          cd client
          npm run build

  docker-build:
    name: Docker Build & Push
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kai-flow-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/kai-flow-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max