services:
  db:
    image: postgres:15-alpine
    container_name: kai-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kai}
      POSTGRES_USER: ${POSTGRES_USERNAME:-kai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kai}
    ports:
      - "5432:5432"
    volumes:
      - kai_db_data:/var/lib/postgresql/data
    networks:
      - kai_network

  kai-flow-backend:
    build: .
    image: kai-flow-backend:latest
    container_name: kai-flow-backend
    ports:
      - "${BACKEND_PORT:-23056}:8000"
    environment:
      # Core Application Settings
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      BACKEND_PORT: ${BACKEND_PORT:-23056}
      ROOT_PATH: ${ROOT_PATH}

      # Database Settings
      CREATE_DATABASE: ${CREATE_DATABASE}
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: ${DATABASE_SSL}
      DISABLE_DATABASE: ${DISABLE_DATABASE}

      # Security
      MASTER_API_KEY: ${MASTER_API_KEY}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY}

      # Basic Settings
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAI_FLOW_LOGGING_PRESET: ${KAI_FLOW_LOGGING_PRESET:-}
      KAI_FLOW_FILE_LOGGING: ${KAI_FLOW_FILE_LOGGING:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}

      # Model security artifacts are streamed to persistent disk, never kept in RAM.
      KAI_MODEL_ARTIFACT_DIR: /data/model-artifacts
      KAI_MODEL_STAGING_DIR: /data/model-scan-staging
      KAI_MODEL_MAX_ARTIFACT_BYTES: ${KAI_MODEL_MAX_ARTIFACT_BYTES:-274877906944}
      KAI_MODEL_ARCHIVE_MAX_EXPANDED_BYTES: ${KAI_MODEL_ARCHIVE_MAX_EXPANDED_BYTES:-274877906944}
      KAI_MODEL_UPLOAD_MAX_BYTES: ${KAI_MODEL_UPLOAD_MAX_BYTES:-8589934592}
      KAI_MODEL_SCAN_MEMORY_LIMIT_BYTES: ${KAI_MODEL_SCAN_MEMORY_LIMIT_BYTES:-4294967296}
      # Browser uploads are temporary execution artifacts, not a model repository.
      KAI_MODEL_MANAGED_RETENTION_SECONDS: ${KAI_MODEL_MANAGED_RETENTION_SECONDS:-86400}
      KAI_MODEL_MANAGED_POST_SCAN_RETENTION_SECONDS: ${KAI_MODEL_MANAGED_POST_SCAN_RETENTION_SECONDS:-3600}
      KAI_MODEL_INCOMPLETE_RETENTION_SECONDS: ${KAI_MODEL_INCOMPLETE_RETENTION_SECONDS:-3600}
      KAI_MODEL_STAGING_RETENTION_SECONDS: ${KAI_MODEL_STAGING_RETENTION_SECONDS:-7200}
      KAI_MODEL_ARTIFACT_GC_INTERVAL_SECONDS: ${KAI_MODEL_ARTIFACT_GC_INTERVAL_SECONDS:-900}
      KAI_MODEL_UPLOAD_RESERVATION_SECONDS: ${KAI_MODEL_UPLOAD_RESERVATION_SECONDS:-7200}
      # Warn at the soft threshold, evict temporary uploads at aggressive pressure,
      # and reject new upload/staging reservations at the hard threshold.
      KAI_MODEL_STORAGE_SOFT_PERCENT: ${KAI_MODEL_STORAGE_SOFT_PERCENT:-75}
      KAI_MODEL_STORAGE_AGGRESSIVE_PERCENT: ${KAI_MODEL_STORAGE_AGGRESSIVE_PERCENT:-85}
      KAI_MODEL_STORAGE_HARD_PERCENT: ${KAI_MODEL_STORAGE_HARD_PERCENT:-90}
      KAI_MODEL_STORAGE_MIN_FREE_BYTES: ${KAI_MODEL_STORAGE_MIN_FREE_BYTES:-21474836480}
      KAI_MODEL_STORAGE_MIN_FREE_PERCENT: ${KAI_MODEL_STORAGE_MIN_FREE_PERCENT:-15}
      # JSON keeps Windows drive-letter syntax portable when the backend runs natively.
      # In this container, mount company storage read-only at /models and enter /models/...
      KAI_MODEL_LOCAL_ALLOWED_ROOTS: '${KAI_MODEL_LOCAL_ALLOWED_ROOTS:-["/models"]}'

      # LangSmith Settings
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2}
      LANGCHAIN_ENDPOINT: ${LANGCHAIN_ENDPOINT}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT}

      # Workflow Tracing
      ENABLE_WORKFLOW_TRACING: ${ENABLE_WORKFLOW_TRACING:-false}
      TRACE_AGENT_REASONING: ${TRACE_AGENT_REASONING:-false}
      TRACE_MEMORY_OPERATIONS: ${TRACE_MEMORY_OPERATIONS:-false}

      # Keycloak Settings
      KEYCLOAK_ENABLED: ${KEYCLOAK_ENABLED:-false}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_VERIFY_SSL: ${KEYCLOAK_VERIFY_SSL}
    command: >
      sh -c "python migrations/database_setup.py && 
             uvicorn main:app --host 0.0.0.0 --port 8000"
    networks:
      - kai_network
    volumes:
      - kai_model_artifacts:/data/model-artifacts
      - kai_model_scan_staging:/data/model-scan-staging
      # Example enterprise bind/PVC mount (do not copy models into the image):
      # - /mnt/company-models:/models:ro
    stdin_open: true
    tty: true

    depends_on:
      - db
    restart: always

  kai-flow-frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_VERSION: ${VITE_API_VERSION}
        VITE_BASE_PATH: ${VITE_BASE_PATH}
        VITE_NODE_ENV: ${VITE_NODE_ENV}
        VITE_ENABLE_LOGGING: ${VITE_ENABLE_LOGGING}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
        VITE_ENTERPRISE: ${ENTERPRISE}
    container_name: kai-flow-frontend
    ports:
      - "23058:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_BASE_PATH: ${VITE_BASE_PATH}
      VITE_API_VERSION: ${VITE_API_VERSION}
      VITE_NODE_ENV: ${VITE_NODE_ENV}
      VITE_ENABLE_LOGGING: ${VITE_ENABLE_LOGGING}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
      VITE_ENTERPRISE: ${ENTERPRISE}
    networks:
      - kai_network
    restart: unless-stopped
    depends_on:
      - kai-flow-backend

networks:
  kai_network:
    driver: bridge

volumes:
  kai_db_data:
  kai_model_artifacts:
  kai_model_scan_staging:
